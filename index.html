<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.O.P Systems</title>
    <style>
        /* CSS-muuttujat väreille ja teemalle */
        :root {
            --bg-base: #0a0b10;
            --bg-window: #13141c;
            --text-main: #c0c5ce;
            --text-muted: #65737e;
            --border-color: #2b2c36;
            
            /* Sovellusten avainvärit */
            --trmping-color: #00ff41;
            --trmping-glow: rgba(0, 255, 65, 0.15);
            
            --trakr-color: #a26bff;
            --trakr-glow: rgba(162, 107, 255, 0.15);
        }

        body { 
            font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            padding: 40px 20px; 
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            
            /* Hienovarainen Linux-työpöydän pisteverkkotausta (Dot grid) */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container { 
            max-width: 750px; 
            width: 100%;
            z-index: 1; 
            position: relative; 
        }

        /* Pääotsikko - CLI Prompt tyyliin */
        .prompt-header {
            font-size: 1.3em;
            margin-bottom: 40px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .prompt-user { color: #82aaff; font-weight: bold; }
        .prompt-host { color: #c3e88d; font-weight: bold; }
        .prompt-dir { color: #89ddff; }
        .blink { animation: blinker 1s step-end infinite; color: var(--text-main); }

        /* Tiling Window Manager (TWM) -tyylinen Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            align-items: start; 
        }

        /* Yksittäinen "Ikkuna" */
        .window {
            background-color: var(--bg-window);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .window:hover {
            transform: translateY(-2px);
        }

        /* Ikkunan yläpalkki (Titlebar) */
        .titlebar {
            padding: 8px 15px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            background-color: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .titlebar-dots {
            display: flex;
            gap: 6px;
            margin-right: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--border-color);
        }

        /* Ikkunan sisältö */
        .window-content {
            padding: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        /* Napit (Modernit terminaalikomennot) */
        a { 
            text-decoration: none; 
            font-size: 0.9em;
            padding: 10px 15px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a::after {
            content: "→";
            opacity: 0.5;
            transition: transform 0.2s ease;
        }

        a:hover::after {
            transform: translateX(4px);
            opacity: 1;
        }

        /* === trmPING TEEMA (Vihreä) === */
        .window.trmping:hover {
            border-color: var(--trmping-color);
            box-shadow: 0 10px 30px var(--trmping-glow);
        }
        .window.trmping .titlebar-text { color: var(--trmping-color); text-shadow: 0 0 8px var(--trmping-glow); }
        .window.trmping .dot:nth-child(1) { background-color: var(--trmping-color); box-shadow: 0 0 5px var(--trmping-color); }
        
        .window.trmping a { color: var(--text-main); }
        .window.trmping a:hover {
            background-color: var(--trmping-glow);
            border-color: var(--trmping-color);
            color: var(--trmping-color);
        }

        /* === TRAKR TEEMA (Violetti) === */
        .window.trakr:hover {
            border-color: var(--trakr-color);
            box-shadow: 0 10px 30px var(--trakr-glow);
        }
        .window.trakr .titlebar-text { color: var(--trakr-color); text-shadow: 0 0 8px var(--trakr-glow); }
        .window.trakr .dot:nth-child(1) { background-color: var(--trakr-color); box-shadow: 0 0 5px var(--trakr-color); }
        
        .window.trakr a { color: var(--text-main); }
        .window.trakr a:hover {
            background-color: var(--trakr-glow);
            border-color: var(--trakr-color);
            color: var(--trakr-color);
        }

        @keyframes blinker { 50% { opacity: 0; } }

        /* MOBIILIOPTIMOINTI */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .prompt-header { font-size: 1.1em; margin-bottom: 25px; }
            .app-grid { grid-template-columns: 1fr; gap: 20px; }
            .window-content { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linux Prompt -tyylinen otsikko -->
        <div class="prompt-header">
            <span class="prompt-user">root</span>@<span class="prompt-host">mop-systems</span>:<span class="prompt-dir">~</span>$ ls -l ./apps<span class="blink">_</span>
        </div>

        <div class="app-grid">
            
            <!-- Sovellus 1: trmPING (Vihreä teema) -->
            <div class="window trmping">
                <div class="titlebar">
                    <div class="titlebar-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="titlebar-text">trmPING</span>
                </div>
                <div class="window-content">
                    <div class="links">
                        <a href="https://play.google.com/store/apps/details?id=com.mop.trmping" target="_blank">
                            <span>./play_store</span>
                        </a>
                        <a href="https://mop-systems.github.io/trmping/privacy.html">
                            <span>./privacy_policy</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Sovellus 2: TRAKR (Violetti teema) -->
            <div class="window trakr">
                <div class="titlebar">
                    <div class="titlebar-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="titlebar-text">TRAKR</span>
                </div>
                <div class="window-content">
                    <div class="links">
                        <a href="https://play.google.com/store/apps/details?id=com.mop.trakr" target="_blank">
                            <span>./play_store</span>
                        </a>
                        <a href="https://mop-systems.github.io/trakr/privacy.html">
                            <span>./privacy_policy</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div> 
</body>
</html>
