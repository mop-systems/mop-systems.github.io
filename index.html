<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.O.P Systems</title>
    <style>
        /* CSS-muuttujat väreille ja teemalle */
        :root {
            --bg-base: #0a0b10;
            --bg-window: #13141c;
            --text-main: #c0c5ce;
            --text-muted: #65737e;
            --border-color: #2b2c36;
            
            /* Sovellusten avainvärit */
            --trmping-color: #00ff41;
            --trmping-glow: rgba(0, 255, 65, 0.15);
            
            --trakr-color: #a26bff;
            --trakr-glow: rgba(162, 107, 255, 0.15);
        }

        body { 
            font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; 
            color: var(--text-main); 
            padding: 50px 20px; 
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            background-color: var(--bg-base);
        }

        /* --- INTERAKTIIVINEN TAUSTA --- */
        .wallpaper {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: -2;
            background-color: var(--bg-base);
            /* Hienovarainen pisteverkkotausta */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .cursor-glow {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: -1;
            pointer-events: none; /* Ei estä klikkauksia */
            /* Piirtää hehkun kursorin koordinaatteihin */
            background: radial-gradient(
                circle 500px at var(--mouse-x, -100%) var(--mouse-y, -100%),
                rgba(255, 255, 255, 0.07),
                transparent 40%
            );
        }
        /* ------------------------------ */

        .container { 
            max-width: 750px; 
            width: 100%;
            z-index: 1; 
            position: relative; 
        }

        /* Pääotsikko */
        .main-title {
            font-size: 2.8em;
            margin: 0 0 40px 0;
            color: #ffffff;
            letter-spacing: 4px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        .main-title .blink { 
            animation: blinker 1s step-end infinite; 
            color: var(--border-color); 
        }

        /* Tiling Window Manager (TWM) -tyylinen Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            align-items: start; 
        }

        /* Yksittäinen "Ikkuna" */
        .window {
            background-color: var(--bg-window);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .window:hover {
            transform: translateY(-2px);
        }

        /* Ikkunan yläpalkki (Titlebar) */
        .titlebar {
            padding: 8px 15px;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            background-color: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .titlebar-dots {
            display: flex;
            gap: 6px;
            margin-right: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: all 0.2s ease;
        }

        /* Ikkunan sisältö */
        .window-content {
            padding: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        /* Napit */
        a { 
            text-decoration: none; 
            font-size: 0.9em;
            padding: 10px 15px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a::after {
            content: "→";
            opacity: 0.5;
            transition: transform 0.2s ease;
        }

        a:hover::after {
            transform: translateX(4px);
            opacity: 1;
        }

        /* === trmPING TEEMA (Vihreä) === */
        .window.trmping:hover {
            border-color: var(--trmping-color);
            box-shadow: 0 10px 30px var(--trmping-glow);
        }
        .window.trmping:hover .titlebar-text { color: var(--trmping-color); text-shadow: 0 0 8px var(--trmping-glow); }
        .window.trmping:hover .dot:nth-child(1) { background-color: var(--trmping-color); box-shadow: 0 0 5px var(--trmping-color); }
        
        .window.trmping a { color: var(--text-main); }
        .window.trmping a:hover {
            background-color: var(--trmping-glow);
            border-color: var(--trmping-color);
            color: var(--trmping-color);
        }

        /* === TRAKR TEEMA (Violetti) === */
        .window.trakr:hover {
            border-color: var(--trakr-color);
            box-shadow: 0 10px 30px var(--trakr-glow);
        }
        .window.trakr:hover .titlebar-text { color: var(--trakr-color); text-shadow: 0 0 8px var(--trakr-glow); }
        .window.trakr:hover .dot:nth-child(1) { background-color: var(--trakr-color); box-shadow: 0 0 5px var(--trakr-color); }
        
        .window.trakr a { color: var(--text-main); }
        .window.trakr a:hover {
            background-color: var(--trakr-glow);
            border-color: var(--trakr-color);
            color: var(--trakr-color);
        }

        @keyframes blinker { 50% { opacity: 0; } }

        /* MOBIILIOPTIMOINTI */
        @media (max-width: 600px) {
            body { padding: 30px 15px; }
            .main-title { font-size: 2em; margin-bottom: 30px; letter-spacing: 2px; }
            .app-grid { grid-template-columns: 1fr; gap: 20px; }
            .window-content { padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- Taustakerrokset -->
    <div class="wallpaper"></div>
    <div class="cursor-glow"></div>

    <!-- Varsinainen sisältö -->
    <div class="container">
        
        <!-- Puhdas ja näyttävä otsikko -->
        <h1 class="main-title">M.O.P Systems<span class="blink">_</span></h1>

        <div class="app-grid">
            
            <!-- Sovellus 1: trmPING (Vihreä teema) -->
            <div class="window trmping">
                <div class="titlebar">
                    <div class="titlebar-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="titlebar-text">trmPING_v1.24</span>
                </div>
                <div class="window-content">
                    <div class="links">
                        <a href="https://play.google.com/store/apps/details?id=com.mop.trmping" target="_blank">
                            <span>./play_store</span>
                        </a>
                        <a href="https://mop-systems.github.io/trmping/privacy.html">
                            <span>./privacy_policy</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Sovellus 2: TRAKR (Violetti teema) -->
            <div class="window trakr">
                <div class="titlebar">
                    <div class="titlebar-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="titlebar-text">TRAKR_v2.0</span>
                </div>
                <div class="window-content">
                    <div class="links">
                        <a href="https://play.google.com/store/apps/details?id=com.mop.trakr" target="_blank">
                            <span>./play_store</span>
                        </a>
                        <a href="https://mop-systems.github.io/trakr/privacy.html">
                            <span>./privacy_policy</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div> 

    <!-- Skripti kursorin valoefektiä varten -->
    <script>
        document.addEventListener('mousemove', (e) => {
            // Päivitetään CSS-muuttujat hiiren sijainnin mukaan
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        });
    </script>
</body>
</html>
